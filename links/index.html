let lang = store.get('fmd.lang') === 'en' ? 'en' : 'zh';
const $ = (id) => document.getElementById(id);

function renderList(el, rows, community = false) {
  el.innerHTML = rows.map((row) => {
    const label = row.k[lang] + (community ? ` <span class="tag">${COPY[lang].communityTag}</span>` : '');
    const body = row.code
      ? `<a href="${row.href}" target="_blank" rel="noopener noreferrer">${row.href}</a><br><code>${row.code}</code>`
      : `<a href="${row.href}"${row.href.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : ''}>${row.href}</a>`;
    return `<dt>${label}</dt><dd>${body}</dd>`;
  }).join('');
}

function render() {
  const t = COPY[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = `${t.title} · FabX Miner Desk`;
  $('title').textContent = t.title;
  for (const id of ['navDesk', 'navStart', 'navCheck', 'navFaq']) $(id).textContent = t[id];
  $('intro').textContent = t.intro;
  $('fabx-title').textContent = t.fabxTitle;
  $('tapeout-title').textContent = t.tapeoutTitle;
  $('desk-title').textContent = t.deskTitle;
  $('community-title').textContent = t.communityTitle;
  $('community-note').textContent = t.communityNote;
  $('footer').innerHTML = t.footer;
  $('lang').textContent = lang === 'zh' ? 'EN' : '中文';
  renderList($('fabx-list'), ROWS.fabx);
  renderList($('tapeout-list'), ROWS.tapeout);
  renderList($('desk-list'), ROWS.desk);
  renderList($('community-list'), ROWS.community, true);
}
$('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; store.set('fmd.lang', lang); render(); };
