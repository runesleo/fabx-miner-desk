<style>

    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --card: #171a1f; --ink: #e8eaee; --muted: #9aa2ae; --line: #2a2f37; --soft: #20242b;

    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  header b { font-size: 17px; letter-spacing: -.01em; }
  .ghost { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .answer { font-size: 22px; line-height: 1.45; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .answer .num { font-family: var(--mono); }
  .sub { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .primary { font: inherit; font-weight: 600; width: 100%; border: 0; border-radius: 12px; padding: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  .primary:disabled { opacity: .55; cursor: default; }
  .link { font: inherit; font-size: 14px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input { font: 15px var(--mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; flex: 1; }
  .small { font-size: 13px; color: var(--muted); }
  .err { color: var(--bad); font-size: 14px; margin: 8px 0 0; }
  .since { font-size: 14px; color: var(--muted); margin: 0; }
  details.more { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; }
  details.more > summary { cursor: pointer; padding: 12px 0; color: var(--muted); font-size: 15px; }
  details.more[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; margin: 8px 0 16px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { font-family: var(--mono); text-align: right; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 4px 2px; }
  td input { width: 64px; flex: none; padding: 6px 8px; }
  ul.method { padding-left: 18px; font-size: 13px; color: var(--muted); }
  footer { text-align: center; font-size: 12px; color: var(--muted); }
  .steps { margin: 0; font-size: 15px; color: var(--muted); }
  .asset-card { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 2px; }
  .asset-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
  .asset-stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .asset-stat span, .asset-stat small { display: block; color: var(--muted); font-size: 12px; }
  .asset-stat strong { display: block; font: 600 18px/1.6 var(--mono); overflow-wrap: anywhere; }
  .asset-note { margin: 8px 0; font-size: 12px; color: var(--muted); }
  .rig-table, .future-table { table-layout: fixed; font-size: 12px; }
  .rig-table th, .future-table th { color: var(--muted); font-weight: 500; text-align: left; }
  .rig-table th, .rig-table td, .future-table th, .future-table td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  .rig-table th:nth-child(1) { width: 18%; }
  .rig-table th:nth-child(2) { width: 23%; }
  .rig-table th:nth-child(3) { width: 31%; }
  .rig-table th:nth-child(4) { width: 28%; }
  .rig-table .rig-number, .future-table td { font-family: var(--mono); }
  .rig-value small { display: block; color: var(--muted); }
  .rig-summary { font-size: 12px; white-space: nowrap; }
  .rig-list > summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 10px 0; }
  .rig-stopped { background: color-mix(in srgb, var(--warn) 9%, transparent); }
  .rig-stopped .rig-status { color: var(--warn); font-weight: 600; }
  #entryAnswer { font-size: 18px; line-height: 1.4; text-wrap: initial; }
  #entryTitle { margin: 4px 0 0; }
  .entry-values { margin: 10px 0 6px; }
  .entry-values strong { font-size: 19px; }
  .entry-row { padding: 13px 0; border-top: 1px solid var(--line); }
  .entry-row:first-child { border-top: 0; }
  .entry-row .row { justify-content: space-between; align-items: baseline; }
  .entry-row strong { font: 600 16px var(--mono); }
  .entry-row p { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
  .entry-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
  #entryStamp, #entryStatus { font-size: 12px; overflow-wrap: anywhere; }
  #entryStamp { margin: 0; }
  #entryDetails > summary, #riskDetails > summary { padding: 6px 0; }
  .risk { padding: 8px 12px; border-left: 3px solid var(--muted); }
  .risk h2 { margin: 0; font-size: 12px; font-weight: 500; }
  .risk p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .source { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .official-links { display: grid; gap: 8px; margin: 12px 0; }
  .official-links a { display: block; padding: 10px 12px; border-radius: 10px; background: var(--soft); color: var(--accent); font-size: 14px; text-decoration: none; }
  .basics-number { margin: 12px 0; font-size: 14px; }
  .basics-number small { display: block; font-size: 12px; color: var(--muted); }
  @media (max-width: 440px) {
    main { padding-top: 16px; gap: 8px; }
    #entryCompare { padding: 16px; }
    details.more { padding: 2px 16px; }
    details.more > summary { padding: 9px 0; }
    .rig-summary { font-size: 11px; letter-spacing: -.2px; }
    .rig-table th, .rig-table td { padding: 7px 2px; }
    .future-table th, .future-table td { padding: 8px 2px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: no-preference) { .card { transition: opacity .2s; } }

let walletRequest = 0, loadRequest = 0, coreLoad = null, loadError = null;
let coreController = null, walletController = null, walletExpiresAt = 0;
let entryResult = null, entryController = null, entryLoading = false, entryExpanded = false;
let rigsExpanded = false;
let walletMessage = null, sinceVisit = null;
const errorText = e => e?.name === 'TimeoutError' ? L.timedOut : L.readError(e);
function setWalletMessage(key, error = null) {
  walletMessage = { key, error };
  $('werr').textContent = error ? L[key](errorText(error)) : L[key];
}
let optionalController = null, retryTimer = null, staleCore = false;
const OPTIONAL_RETRY_MS = 60_000;
const growthCache = new Map();
let rule = (() => { try { return JSON.parse(store.get('fmd.rule')) || { on: false, rows: [] }; } catch { return { on: false, rows: [] }; } })();

function applyStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = L.appTitle;
  document.querySelector?.('meta[name="description"]')?.setAttribute('content', L.description);
  $('appTitle').textContent = L.appTitle;
  for (const id of ['lang', 'todayEyebrow', 'investQ', 'mineQ', 'mine', 'go', 'readOnly', 'example', 'moreLabel', 'primer', 'netH', 'nandH', 'apply', 'ruleH', 'ruleOnL', 'ruleAdd', 'methodH', 'footer', 'manualNand', 'entryTitle', 'entryRetry', 'entryScope', 'entryCosts', 'entryTop', 'entryMethodTitle', 'entryMethod', 'entryDetailTitle', 'riskDetailTitle', 'riskText', 'basicsTitle', 'basicsContent', 'basicsSource', 'firstStepsTitle', 'firstStepsNote', 'officialHome', 'officialRigs', 'officialNand', 'officialVerified', 'already']) $(id).textContent = L[id];
  $('addr').placeholder = L.addrPh; $('nand').placeholder = L.nandPh;
  $('method').innerHTML = L.method.map((m) => `<li>${m}</li>`).join('');
  $('budgets').innerHTML = BUDGETS.map((b) => `<button class="chip" data-b="${b}" aria-pressed="${b === budget}">$${b.toLocaleString()}</button>`).join('');
  $('budgets').querySelectorAll('.chip').forEach((c) => { c.onclick = () => { budget = Number(c.dataset.b); store.set('fmd.budget', budget); applyStatic(); renderInvest(); }; });
}

function cacheAge(asOf) {
  const time = Date.parse(asOf);
  return Number.isFinite(time) ? L.cacheAge(Math.max(0, (Date.now() - time) / 60000)) : L.cacheUnknownAge;
}

function availabilityNote(key) {
  const entry = snap?.availability?.[key];
  if (!entry || entry.state === 'live' || entry.state === 'skipped') return '';
  if (entry.state === 'manual') return L.manualSource;
  const label = key === 'history' ? L.historyLabel : L.nandLabel;
  if (entry.state === 'pending') return `${label}: ${L.optionalPending}`;
  const cached = entry.state === 'cached' ? ` · ${L.cachedAge(cacheAge(entry.asOf))}` : '';
  return `${label}: ${L.optionalUnavailable}${cached}`;
}

function nandSourceText() {
  if (snap.availability?.nand?.state === 'manual') return L.manualSource;
  const quote = snap.decision.nandQuote;
  if (quote?.kind === 'onchain-ask') return L.nandSources.ask(f(quote.qty, 0));
  if (quote?.hours) return L.nandSources.cached(f(quote.hours, 0), f(quote.qty, 0));
  return L.nandSources.unknown;
}

function nandPriceNote() {
  if (!snap?.decision.nandOkb) return '';
  const manual = snap.availability?.nand?.state === 'manual';
  return L.nandPrice(f(snap.decision.nandOkb, 7), nandSourceText(),
    manual ? '' : cacheAge(snap.availability?.nand?.asOf));
}

function observationTime(value) {
  const date = value == null ? null : new Date(value);
  return date && Number.isFinite(date.getTime()) ? date.toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-GB', { timeZoneName: 'short' }) : L.cacheUnknownAge;
}

function snapshotSource() {
  return L.coreSource(f(snap?.head, 0), observationTime(snap?.headTimestamp ? snap.headTimestamp * 1000 : null), observationTime(snap?.asOf));
}

function nandProvenance() {
  const state = snap?.availability?.nand;
  const source = !snap?.decision.nandOkb ? L.unavailableSource : state?.state === 'manual' ? L.manualSource
    : (state?.state === 'cached' ? L.cachedAge(cacheAge(state.asOf)) + ' · ' : '') + nandSourceText();
  return L.nandProvenance(source, observationTime(state?.asOf));
}

function renderNewbie() {
  const chain = L.chainSource(f(snap?.head, 0), observationTime(snap?.headTimestamp ? snap.headTimestamp * 1000 : null));
  $('riskTitle').textContent = L.riskTitle(snap?.network.sealed);
  $('riskState').textContent = (typeof snap?.network.sealed === 'boolean' ? L.riskState(snap.network.sealed) : L.riskUnknown)
    + (snap ? ' ' + chain : '')
    + (staleCore ? ' ' + L.staleCore(cacheAge(snap?.asOf)) : '');
  const number = (label, value, provenance) => `<p class="basics-number">${esc(label)}: <b>${esc(value)}</b><small>${esc(provenance)}</small></p>`;
  $('basicsNumbers').innerHTML = number(L.basicsFab, snap?.prices.fabUsd == null ? '—' : L.money(f(snap.prices.fabUsd, 4)), snapshotSource())
    + number(L.basicsMiners, f(snap?.network.miners, 0), chain)
    + number(L.basicsNand, snap?.decision.nandOkb == null ? '—' : L.amountOkb(f(snap.decision.nandOkb, 7)), nandProvenance())
    + `<p class="basics-number">${esc(L.basicsLatch)}</p>`
    + (staleCore ? `<p class="source">${esc(L.staleCore(cacheAge(snap?.asOf)))}</p>` : '');
  const sources = [snapshotSource(), nandProvenance(), L.modelSource].join(' ');
  $('paybackSource').textContent = sources;
  $('investSource').textContent = sources;
  $('netSource').textContent = sources + (availabilityNote('history') ? ' ' + availabilityNote('history') : '');
}

function render() {
  renderNewbie();
  renderEntry();
  if (walletMessage) setWalletMessage(walletMessage.key, walletMessage.error);
  if (sinceVisit) renderSince();
  if (!snap) {
    $('answer').textContent = loadError ? L.failed(errorText(loadError)) : L.loading;
    $('answerSub').textContent = ''; $('dataStatus').textContent = '';
    $('invest').textContent = loadError ? '—' : L.loading; $('investSub').textContent = '';
    $('net').textContent = ''; show('manualNand', false); show('assetCard', false);
    return;
  }
  const { prices: p, network: n, decision: d } = snap;
  const pb = d.paybackDays;
  const dev = d.ratio == null ? null : (d.ratio - 1) * 100;
  const devTxt = dev == null ? null : L.deviation(dev);
  $('answer').innerHTML = pb == null ? L.answerNoNand(f(p.fabUsd, 4)) : L.answer(f(pb, 0));
  const t = rule.on && d.ratio != null && Number.isFinite(d.ratio) ? tierFor(d.ratio, rule.rows) : null;
  $('answerSub').innerHTML = L.answerSub(devTxt, pb == null ? null : pct(365 / pb), n.sealed) + (t ? `<br><b>${t.sell ? L.ruleSays(pct(t.sell, 1)) : L.ruleHold}</b>` : '');
  const notes = ['history', 'nand'].map(availabilityNote).filter(Boolean);
  if (staleCore) notes.unshift(L.staleCore(cacheAge(snap.asOf)));
  if (p.crossCheck?.state === 'different') notes.push(L.crossCheck(f(p.crossCheck.relativeDifference * 100, 1)));
  $('dataStatus').textContent = notes.join(' · ');
  show('manualNand', d.nandOkb == null);
  renderInvest();
  renderMine();
  const k = L.kv;
  const nandAge = snap.availability?.nand?.asOf ? ` · ${cacheAge(snap.availability.nand.asOf)}` : '';
  $('net').innerHTML = [
    [k.fab, '$' + f(p.fabUsd, 4)], [k.median, p.anchorUsd == null ? '—' : '$' + f(p.anchorUsd, 4)], [k.range, p.lowUsd == null ? '—' : `$${f(p.lowUsd, 4)} – $${f(p.highUsd, 4)}`],
    [k.bem, '$' + f(p.bemUsd, 2)], [k.okb, '$' + f(p.okbUsd, 2)],
    [k.nand, d.nandOkb ? `${f(d.nandOkb, 5)} OKB <span class="small">(${esc(nandSourceText() + nandAge)})</span>` : '—'], [k.cap, d.okbPerFabDay ? `${f(d.okbPerFabDay, 3)} OKB` : '—'],
    [k.net, f(n.networkNand, 0)], [k.miners, n.miners.toLocaleString()], [k.sealed, n.sealed ? k.yes : k.no],
  ].map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
  renderRule();
}

function renderEntry() {
  const result = entryResult, ready = result && ['live', 'cached'].includes(result.state);
  $('entryRetry').disabled = entryLoading || !snap;
  show('entryBook', !!ready);
  if (!ready) {
    $('entryAnswer').textContent = result?.state === 'unavailable' || loadError ? L.entryUnavailable : L.entryLoading;
    $('entryValues').innerHTML = ''; $('entryListings').innerHTML = '';
    $('entryStamp').textContent = ''; $('entryObservation').textContent = ''; $('entryStatus').textContent = ''; $('entryFreshness').textContent = ''; $('entrySources').textContent = '';
    show('entryFreshness', false);
    return;
  }
  const { baseline, ranked = [], unknown = [] } = result;
  const cheapest = ranked[0];
  const buildCost = baseline?.okbPerFabDay, buyCost = cheapest?.okbPerFabDay;
  // Keep the short headline distinct when two prices round to the same cent.
  let digits = 2;
  while (digits < 15 && buildCost !== buyCost && f(buildCost, digits) === f(buyCost, digits)) digits++;
  const emissionUnknown = baseline?.emissionVerified !== true;
  $('entryAnswer').textContent = emissionUnknown ? L.entryEmissionUnknown : result.cheaper === 'build' || result.cheaper === 'listing'
    ? L.entryCheaper(result.cheaper, f(buildCost, digits), f(buyCost, digits))
    : result.cheaper === 'equal' ? L.entryEqual : result.validCount === 0 ? L.entryEmpty : L.entryUnknown;
  $('entryValues').innerHTML = [[L.entryBuild, baseline?.okbPerFabDay], [L.entryBuy, cheapest?.okbPerFabDay]]
    .map(([label, value]) => `<div class="asset-stat"><span>${esc(label)}</span><strong>${f(value, 4)}</strong><small>${L.entryUnit}</small></div>`).join('');
  const time = result.blockTimestamp ? new Date(result.blockTimestamp * 1000) : new Date(result.asOf);
  $('entryStamp').textContent = L.entryStamp(f(result.head, 0), Number.isFinite(time.getTime())
    ? time.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) : L.cacheUnknownAge);
  $('entryObservation').textContent = L.entryObservation(f(result.head, 0), observationTime(time), f(result.windowSeconds == null ? null : result.windowSeconds / 60, 1));
  const provenance = baseline?.nandState === 'cached' ? L.entryNandCached(cacheAge(baseline.nandAsOf)) : baseline?.nandState === 'manual' ? L.entryNandManual : '';
  $('entryFreshness').textContent = [emissionUnknown ? L.entryEmissionUnknown : '', result.state === 'cached' ? L.entryCached(cacheAge(result.asOf)) : entryLoading ? L.entryRefreshing : '', provenance].filter(Boolean).join(' ');
  show('entryFreshness', !!$('entryFreshness').textContent);
  $('entryStatus').textContent = [result.state === 'cached' ? L.entryCached(cacheAge(result.asOf)) : entryLoading ? L.entryRefreshing : L.entryLive,
    baseline?.okbPerFabDay == null ? '' : L.entryNand(f(baseline.nandRequired, 2), f(baseline.nandOkb, 7)), provenance].filter(Boolean).join(' ');
  $('entryCoverage').textContent = L.entryCoverage(f(result.totalScanned, 0), f(result.validCount, 0), f(ranked.length, 0), f(unknown.length, 0));
  const nandSource = baseline?.nandOkb == null ? L.unavailableSource : baseline.nandState === 'manual' ? L.manualSource
    : [provenance, baseline.nandQuote?.kind === 'onchain-ask' ? L.nandSources.ask(f(baseline.nandQuote.qty, 0))
      : baseline.nandQuote?.hours ? L.nandSources.cached(f(baseline.nandQuote.hours, 0), f(baseline.nandQuote.qty, 0)) : L.nandSources.unknown].filter(Boolean).join(' ');
  $('entrySources').textContent = L.coreSource(f(result.head, 0), observationTime(result.blockTimestamp ? result.blockTimestamp * 1000 : null), observationTime(result.priceAsOf))
    + ' ' + L.nandProvenance(nandSource, observationTime(baseline?.nandAsOf))
    + ' ' + (emissionUnknown ? L.entryEmissionUnknown : L.entryEmission(f(baseline.emissionFabPerDay, 6), f(result.head, 0)));
  $('entryBookSource').textContent = $('entryObservation').textContent + ' ' + $('entrySources').textContent;
  const row = (rig, measured) => {
    const url = `https://fabx.tech/c/${CFG.circuits}/${encodeURIComponent(rig.id)}`;
    return `<article class="entry-row"><div class="row"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">#${esc(rig.id)} ↗</a><strong>${measured ? f(rig.okbPerFabDay, 4) : '—'}</strong></div>
      <p>${L.entryPrice} ${f(rig.priceOkb, 5)} OKB · ${f(rig.fabPerDay, 4)} ${L.entryDaily}</p>
      <p>${measured ? `${L.entryUnit} · ${L.entryApr} ${rig.apr == null ? '—' : pct(rig.apr, 1)}` : `${L.entryUnknownRow} · ${esc(L.entryReasons[rig.status] || L.entryReasons.unread)}`}</p></article>`;
  };
  entryExpanded = $('entryAll')?.open ?? entryExpanded;
  const rest = [...ranked.slice(5).map(rig => row(rig, true)), ...unknown.map(rig => row(rig, false))];
  $('entryListings').innerHTML = ranked.slice(0, 5).map(rig => row(rig, true)).join('') + (rest.length
    ? `<details class="rig-list" id="entryAll"${entryExpanded ? ' open' : ''}><summary>${L.entryRest(rest.length)}</summary>${rest.join('')}</details>` : '');
}

async function startEntry(request) {
  if (request !== loadRequest || !snap || staleCore) return;
  entryController?.abort();
  const controller = new AbortController(); entryController = controller;
  entryLoading = true; renderEntry();
  try {
    const result = await loadEntryComparison(snap, { signal: controller.signal });
    if (request === loadRequest && !controller.signal.aborted) entryResult = result;
  } catch (error) {
    if (request === loadRequest && !controller.signal.aborted) entryResult = entryResult && ['live', 'cached'].includes(entryResult.state)
      ? { ...entryResult, state: 'cached', error: error.message } : { state: 'unavailable' };
  } finally {
    if (entryController === controller) { entryController = null; entryLoading = false; renderEntry(); }
  }
}

function renderInvest() {
  if (!snap?.decision.nandOkb) { $('invest').textContent = L.investNoNand; $('investSub').textContent = ''; return; }
  const qty = budget / (snap.decision.nandOkb * snap.prices.okbUsd);
  const r = scenario(snap, qty);
  $('invest').innerHTML = L.invest(f(r.fabPerDay, 2), f(r.usdPerDay, 2), f(r.paybackDays, 0));
  const pb = (fm, nm) => f(paybackFor(snap, qty, fm, nm), 0);
  $('investSub').textContent = L.investSub(pb(0.5, 1), pb(2, 1), pb(5, 1), pb(1, 2));
}

function pendingSummary(w) {
  const known = f(w.pendingKnown, 0), total = f(w.pendingTotal, 0);
  if (w.pendingComplete === true && w.pendingFab != null) return L.pendingTotal(f(w.pendingFab, 2), known, total);
  if (w.pendingKnown > 0 && w.pendingSubtotalFab != null) return L.pendingSubtotal(f(w.pendingSubtotalFab, 2), known, total);
  return L.pendingUnknown(known, total);
}

function renderMine() {
  if (!walletRes || !snap) { show('assetCard', false); return; }
  const w = walletRes, partial = w.discovery?.complete === false;
  show('mineIdle', false); show('mineOut', true); show('mineSub', true);
  show('assetCard', !!w.circuits);
  if (!w.circuits) { $('mineOut').textContent = partial ? L.minePartial(w.discovery.verified ?? 0, w.discovery.expected ?? '—') : L.noRigs; $('mineSub').innerHTML = `<button class="link" id="other">${L.other}</button>`; }
  else {
    const card = assetCard(snap, w);
    $('mineOut').textContent = partial ? L.minePartial(w.discovery.verified ?? w.circuits, w.discovery.expected ?? '—') : L.mineOut(w.circuits);
    $('mineSub').innerHTML = esc(w.loading ? L.measuring : L.mineSub(pendingSummary(w), f(card.fabPerDay == null ? null : w.networkSharePct, 3))) + ` · <button class="link" id="other">${L.other}</button>`;
    renderAssetCard(card);
  }
  if (partial) {
    $('mineSub').innerHTML = `<span class="warn">${esc(L.discoveryPartial)}</span> <button class="link" id="retryMine">${L.retryMine}</button> · ` + $('mineSub').innerHTML;
    $('retryMine').onclick = () => lookup(walletAddr);
  }
  $('other').onclick = () => { if (location.pathname === '/rigs') history.pushState(null, '', '/'); walletRequest++; walletController?.abort(); walletRes = null; walletAddr = null; $('mine').disabled = false; $('mine').textContent = L.mine; show('mineIdle', true); show('mineOut', false); show('mineSub', false); show('assetCard', false); show('werr', false); show('pasteRow', true); $('addr').value = ''; $('addr').focus(); };
}

// One historical read per snapshot head, independent of wallet lookup and language changes.
function growthFor(current) {
  const key = current.head;
  if (!growthCache.has(key)) {
    const entry = { result: null };
    growthCache.set(key, entry);
    deadline(signal => networkGrowth(current, { signal }), Math.max(1, walletExpiresAt - Date.now()))
      .catch(() => ({ measured: false, daily: 0 })).then((result) => {
      entry.result = result;
      if (snap?.head === key && walletRes) renderMine();
    });
  }
  return growthCache.get(key).result;
}

function renderAssetCard(card) {
  // Native details toggles queue their event; read the live state before any rerender.
  rigsExpanded = $('allRigs')?.open ?? rigsExpanded;
  const money = (value) => value == null ? '—' : L.money(f(value, 2));
  const measured = card.rigs.filter((rig) => rig.fabPerDay != null && Number.isFinite(rig.fabPerDay)).length;
  const stat = (label, value, detail = '') => `<div class="asset-stat"><span>${label}</span><strong>${value}</strong>${detail ? `<small>${detail}</small>` : ''}</div>`;
  const headers = [L.rigId, L.rigFab, L.rigValue, L.rigStatus];
  const order = { stopped: 0, unread: 1, 'claimed-in-window': 2, loading: 3, mining: 4 };
  const rigs = [...card.rigs].sort((a, b) => (order[a.status] ?? 1) - (order[b.status] ?? 1));
  const counts = { mining: 0, stopped: 0, 'claimed-in-window': 0, unread: 0, loading: 0 };
  for (const rig of rigs) counts[rig.status in counts ? rig.status : 'unread']++;
  const abnormal = rigs.filter(rig => !['mining', 'loading'].includes(rig.status));
  const table = (rows) => `<table class="rig-table"><thead><tr>${headers.map(label => `<th scope="col">${label}</th>`).join('')}</tr></thead><tbody>${rows.map(rig => {
    const cells = [`<span class="rig-number">${esc(rig.id)}</span>`, `<span class="rig-number">${f(rig.fabPerDay, 2)}</span>`, `<span class="rig-value rig-number">${money(rig.valueUsd)}<small>${L.amountOkb(f(rig.valueOkb, 4))}</small></span>`, `<span class="rig-status">${L.rigStatuses[rig.status] || L.rigStatuses.unread}</span>`];
    return `<tr${rig.status === 'stopped' ? ' class="rig-stopped"' : ''}>${cells.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
  }).join('')}</tbody></table>`;
  const growth = walletRes.loading ? null : growthFor(snap);
  const future = growth ? `<table class="future-table"><thead><tr><th scope="col">${L.futureDays}</th>${[0.5, 1, 2].map((mult) => `<th scope="col">${L.futurePrice(mult)}</th>`).join('')}</tr></thead><tbody>${[30, 90, 180].map((days) => `<tr><th scope="row">${L.dayPeriod(days)}</th>${[0.5, 1, 2].map((fabMult) => `<td>${money(futureValue(snap, card.fabPerDay, days, { dailyNetGrowth: growth.daily, fabMult }))}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '';
  $('assetCard').innerHTML = `<h3>${L.assetH}</h3>
    ${walletAddr?.toLowerCase() === CFG.exampleWallet.toLowerCase() ? `<p class="asset-note">${esc(L.exampleDisclosure)}<br><span style="overflow-wrap:anywhere">${esc(walletAddr)}</span></p>` : ''}
    ${walletRes.discovery?.complete === false ? `<p class="asset-note warn">${esc(L.discoveryPartial)}</p>` : ''}
    <div class="asset-summary">${stat(L.assetValue, money(card.valueUsd), L.amountOkb(f(card.valueOkb, 4)))}${stat(L.assetOutput, L.amountFab(f(card.fabPerDay, 2)), `${money(card.usdPerDay)} ${L.perDay}`)}${stat(L.assetApr, card.apr == null ? '—' : f(card.apr * 100, 1) + '%')}${stat(L.assetPayback, f(card.paybackDays, 0), L.days)}</div>
    <p class="asset-note">${esc(walletRes.loading ? L.measuring : L.assetCoverage(measured, walletRes.circuits, f(walletRes.windowSeconds == null ? null : walletRes.windowSeconds / 60, 1)))}</p>
    ${walletRes.loading ? '' : `<p class="asset-note">${esc(pendingSummary(walletRes))}</p>`}
    ${walletRes.loading ? '' : `<p class="asset-note">${esc(L.assetStamp(f(walletRes.head, 0), walletRes.blockTimestamp ? new Date(walletRes.blockTimestamp * 1000).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-GB', { timeZoneName: 'short' }) : L.cacheUnknownAge))}</p>`}
    ${walletRes.loading ? '' : `<p class="asset-note">${L.assetUnknown}</p>`}
    ${snap.decision.nandOkb == null ? `<p class="asset-note warn">${L.assetNoNand}</p>` : ''}
    ${nandPriceNote() ? `<p class="asset-note">${esc(nandPriceNote())}</p>` : ''}
    ${availabilityNote('nand') ? `<p class="asset-note">${esc(availabilityNote('nand'))}</p>` : ''}
    <p class="asset-note">${L.assetBasis}</p>
    <h3>${L.rigH}</h3>
    <p class="rig-summary">${walletRes.loading ? L.rigLoadingSummary(rigs.length) : L.rigSummary(rigs.length, counts)}</p>
    ${abnormal.length ? table(abnormal) : ''}
    <details id="allRigs" class="rig-list"${rigsExpanded ? ' open' : ''}>
      <summary id="allRigsLabel">${L.rigToggle(rigs.length, rigsExpanded)}</summary>${table(rigs)}
    </details>
    ${walletRes.loading ? '' : `<h3>${L.futureH}</h3>
    <p class="asset-note">${growth ? (growth.measured ? esc(L.futureMeasured(f(growth.daily * 100, 3))) : L.futureAssumed) : L.futureLoading}</p>
    ${future}<p class="asset-note">${L.futureBasis}</p>
    <details class="rig-list"><summary>${L.assetSourcesTitle}</summary><p class="source">${esc(snapshotSource() + ' ' + nandProvenance())}</p></details>`}`;
  $('allRigs').ontoggle = () => {
    rigsExpanded = $('allRigs').open;
    $('allRigsLabel').textContent = L.rigToggle(rigs.length, rigsExpanded);
  };
}

function renderRule() {
  $('ruleOn').checked = rule.on; show('ruleBox', rule.on);
  rule.rows.sort((a, b) => b.minRatio - a.minRatio);
  $('ruleRows').innerHTML = rule.rows.map((r) => `<tr><td>${L.ruleRow}</td><td><input type="number" value="${Math.round(r.minRatio * 100)}" data-k="minRatio">%</td><td>${L.ruleSell}</td><td><input type="number" value="${Math.round(r.sell * 1000) / 10}" data-k="sell">%</td><td><button class="link" data-del>✕</button></td></tr>`).join('');
  $('ruleRows').querySelectorAll('tr').forEach((tr, i) => {
    tr.querySelectorAll('input').forEach((inp) => { inp.onchange = () => { rule.rows[i][inp.dataset.k] = Math.max(0, parseFloat(inp.value) || 0) / 100; saveRule(); render(); }; });
    tr.querySelector('[data-del]').onclick = () => { rule.rows.splice(i, 1); saveRule(); render(); };
  });
}

function renderSince() {
  const { prev, now, gap } = sinceVisit;
  $('since').textContent = L.since([L.sFab((now.fab / prev.fab - 1) * 100), L.sNet((now.w / prev.w - 1) * 100)].join(' · '), L.ago(gap / 3.6e6));
}

function showSince(fresh) {
  let prev = null;
  try { prev = JSON.parse(store.get('fmd.visit')); } catch {}
  const now = { t: Date.now(), fab: fresh.prices.fabUsd, w: fresh.network.weight };
  const gap = prev ? now.t - prev.t : 0;
  if (prev && gap > 3 * 3.6e6) {
    sinceVisit = { prev, now, gap }; renderSince();
    show('since', true);
  }
  if (!prev || gap > 3 * 3.6e6) store.set('fmd.visit', JSON.stringify(now));
}

function needsOptionalRetry() {
  return ['history', 'nand'].some((key) => ['cached', 'unavailable'].includes(snap?.availability?.[key]?.state));
}

function scheduleOptionalRetry(request, options) {
  clearTimeout(retryTimer); retryTimer = null;
  if (request !== loadRequest || document.hidden || !needsOptionalRetry()) return;
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (request === loadRequest && !document.hidden) startOptional(request, options, true);
  }, OPTIONAL_RETRY_MS);
}

async function startOptional(request, options, refreshCore = false, remainingMs = CFG.loadTimeoutMs) {
  if (request !== loadRequest || !snap || optionalController) return;
  const controller = new AbortController();
  optionalController = controller;
  const expiresAt = Date.now() + remainingMs;
  let coreRefreshed = !refreshCore;
  try {
    if (refreshCore) {
      // A recovered log scan must cover the current 24h window, not the head from before an outage.
      // Keep the previous answer and wallet rows visible while refreshing; user inputs stay untouched.
      const fresh = await snapshot({ ...options, signal: controller.signal });
      if (request !== loadRequest || controller.signal.aborted) return;
      coreRefreshed = true; staleCore = false; snap = fresh; render();
    }
    const updated = await refreshOptional(snap, { ...options, signal: controller.signal,
      timeoutMs: Math.min(CFG.optionalTimeoutMs, Math.max(1, expiresAt - Date.now())), onUpdate(next) {
      if (request !== loadRequest || controller.signal.aborted) return;
      snap = next; render();
    } });
    if (request === loadRequest && !controller.signal.aborted && updated) { snap = updated; render(); }
  } catch (e) {
    // Optional refresh failures must never replace the usable main answer.
    if (request === loadRequest && !controller.signal.aborted) {
      if (!coreRefreshed) {
        staleCore = true;
        if (entryResult && ['live', 'cached'].includes(entryResult.state)) entryResult = { ...entryResult, state: 'cached', error: e.message };
      }
      for (const key of ['history', 'nand']) {
        if (snap.availability?.[key]?.state === 'pending') snap.availability[key] = { state: 'unavailable', asOf: null, error: e.message };
      }
      render();
    }
  } finally {
    if (optionalController === controller) optionalController = null;
    if (request === loadRequest && !controller.signal.aborted) {
      startEntry(request);
      scheduleOptionalRetry(request, options);
    }
  }
}

async function load() {
  const request = ++loadRequest;
  coreController?.abort();
  entryController?.abort(); entryController = null; entryLoading = false; entryResult = null; entryExpanded = false;
  const controller = new AbortController();
  coreController = controller;
  const expiresAt = Date.now() + CFG.loadTimeoutMs;
  optionalController?.abort(); optionalController = null;
  clearTimeout(retryTimer); retryTimer = null;
  loadError = null; staleCore = false; snap = null; render();
  const value = parseFloat($('nand').value);
  const options = value > 0 ? { nandOkb: value } : {};
  try {
    coreLoad = deadline(signal => snapshot({ ...options, signal }), CFG.loadTimeoutMs, controller.signal);
    const fresh = await coreLoad;
    if (request !== loadRequest) return;
    showSince(fresh);
    const refreshAddress = walletRes ? walletAddr : null;
    if (refreshAddress) { walletRes = null; show('mineOut', false); show('mineSub', false); show('assetCard', false); }
    snap = fresh; render();
    startOptional(request, options, false, Math.max(1, expiresAt - Date.now()));
    if (refreshAddress) lookup(refreshAddress);
  } catch (e) {
    if (request === loadRequest) { loadError = e; render(); }
  }
}

async function currentSnapshot(request) {
  while (!snap && request === walletRequest) {
    if (loadError) throw loadError;
    const pending = coreLoad;
    if (!pending) throw new Error(L.loading);
    await pending.catch(() => {});
    // Let the owning load() publish either its result or its terminal error.
    await Promise.resolve();
  }
  return snap;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(retryTimer); retryTimer = null; }
  else if (!optionalController && snap) {
    const value = snap.availability?.nand?.state === 'manual' ? snap.decision.nandOkb : null;
    scheduleOptionalRetry(loadRequest, value > 0 ? { nandOkb: value } : {});
  }
});

async function lookup(a, timeoutMs = CFG.loadTimeoutMs) {
  $('mineSection').open = true;
  show('werr', false);
  if (!isAddress(a)) { setWalletMessage('badAddr'); show('werr', true); show('pasteRow', true); return; }
  const request = ++walletRequest;
  walletController?.abort();
  const controller = new AbortController();
  walletController = controller;
  walletExpiresAt = Date.now() + timeoutMs;
  walletRes = null; walletAddr = null;
  rigsExpanded = false;
  if ($('allRigs')) $('allRigs').open = false;
  show('mineIdle', true); show('mineOut', false); show('mineSub', false); show('assetCard', false);
  if (a.toLowerCase() !== CFG.exampleWallet) store.set('fmd.addr', a);
  $('mine').disabled = true; $('mine').textContent = L.scanning;
  try {
    const result = await deadline(async signal => {
      let result, measuredSnap;
      // Core wait and every remeasurement share this one budget.
      do {
        measuredSnap = await currentSnapshot(request);
        signal.throwIfAborted();
        if (request !== walletRequest) return;
        result = await wallet(a, measuredSnap, (step, progress) => {
          if (signal.aborted || step !== 'measure' || !progress || request !== walletRequest || measuredSnap.head !== snap?.head) return;
          walletAddr = a.toLowerCase();
          walletRes = { address: a, circuits: progress.ids.length, discovery: progress.discovery, loading: true,
            pendingFab: null, networkSharePct: null, hours: null,
            rigs: progress.ids.map(id => ({ id: String(id), fabPerDay: null, status: 'loading' })) };
          renderMine();
        }, { signal, apiCandidates: false });
        signal.throwIfAborted();
      } while (request === walletRequest && measuredSnap.head !== snap?.head);
      return result;
    }, timeoutMs, controller.signal);
    if (request !== walletRequest) return;
    walletRes = result; walletAddr = a.toLowerCase(); renderMine();
    // SPA navigation omits the address; explicit incoming address links are cleared at startup.
    if (location.pathname !== '/rigs') history.pushState(null, '', '/rigs');
  }
  catch (e) { if (request === walletRequest) {
    if (walletRes?.loading) {
      walletRes = { ...walletRes, loading: false, rigs: walletRes.rigs.map(rig => ({ ...rig, status: 'unread' })) };
      renderMine();
    }
    setWalletMessage('walletFailed', e); show('werr', true); show('mineIdle', true);
    $('addr').value = a; show('pasteRow', true);
  } }
  finally { if (request === walletRequest) { $('mine').disabled = false; $('mine').textContent = L.mine; } }
}

// One button: use the wallet extension to read the address if there is one (read-only), else ask for a paste.
$('mine').onclick = async () => {
  const saved = store.get('fmd.addr');
  if (saved && isAddress(saved)) return lookup(saved);
  const eth = window.okxwallet || window.ethereum;
  if (!eth?.request) { setWalletMessage('noWallet'); show('werr', true); show('pasteRow', true); $('addr').focus(); return; }
  const request = ++walletRequest;
  walletController?.abort();
  try {
    $('mine').textContent = L.mineConnecting;
    const expiresAt = Date.now() + CFG.loadTimeoutMs;
    const [acct] = await deadline(() => eth.request({ method: 'eth_requestAccounts' }), CFG.loadTimeoutMs);
    if (request !== walletRequest) return;
    if (acct) await lookup(acct, Math.max(1, expiresAt - Date.now()));
    else { setWalletMessage('noWallet'); show('werr', true); show('pasteRow', true); }
  } catch (e) {
    if (request !== walletRequest) return;
    $('mine').textContent = L.mine;
    setWalletMessage(e?.code === 4001 ? 'rejected' : 'failed', e?.code === 4001 ? null : e); show('werr', true); show('pasteRow', true);
  } finally { if (request === walletRequest) $('mine').textContent = L.mine; }
};
$('go').onclick = () => lookup($('addr').value.trim());
$('addr').onkeydown = (e) => { if (e.key === 'Enter') lookup($('addr').value.trim()); };
$('example').onclick = () => lookup(CFG.exampleWallet);
$('already').onclick = () => { $('mineSection').open = true; $('mineSection').scrollIntoView({ block: 'start' }); };
$('apply').onclick = load;
$('entryRetry').onclick = load;
$('manualNand').onclick = () => { $('more').open = true; $('nand').focus(); };
$('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; L = T[lang]; store.set('fmd.lang', lang); applyStatic(); render(); };
$('ruleOn').onchange = () => { rule.on = $('ruleOn').checked; saveRule(); render(); };
$('ruleAdd').onclick = () => { rule.rows.push({ minRatio: 1, sell: 0 }); saveRule(); render(); };
applyStatic();
load();
// An explicit read-only address link needs no wallet extension or account request.
const linkedAddress = new URLSearchParams(location.search || '').get('address');
if (linkedAddress && /^(?:\/|\/rigs\/?)$/.test(location.pathname)) {
  history.replaceState(null, '', location.pathname);
  lookup(linkedAddress);
}
</script>
</body>
</html>
