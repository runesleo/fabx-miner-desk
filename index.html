<style>

  .side-cta, .side-more { display: block; text-decoration: none; border-radius: 14px; padding: 14px 16px; }

<body>
<main>
  <header><b id="appTitle">FabX Miner Desk</b><nav class="site-nav"><a href="#now" class="hub-only" id="hubNavNow"></a><a href="#ecosystem" class="hub-only" id="hubNavEco"></a><a href="#tools" class="hub-only" id="hubNavTools"></a><a href="start/" class="calc-only" id="navStart">入门</a><a href="links/" class="calc-only" id="navLinks">入口</a><a href="check/" class="calc-only" id="navCheck">查验</a><a href="faq/" class="calc-only" id="navFaq">FAQ</a><a href="board/" class="calc-only" id="navBoard">看板</a><button class="ghost" id="lang"></button></nav></header>

  <p class="calc-back calc-only"><button type="button" class="link" id="tabRadar"></button></p>

  <section id="radarView" aria-labelledby="radarTitle">

      <p class="radar-live" id="radarLive"></p>
      <h1 id="radarTitle"></h1>
      <p class="sub" id="radarSub"></p>
      <div class="radar-stats" id="radarStats"></div>
    </div>
    <div class="hub-main" id="now">
      <div class="hub-section">
        <h2 id="nowTitle"></h2>
        <p class="small" id="nowSub"></p>
      </div>
      <div class="radar-chips" id="radarChips" role="toolbar" aria-label="Filter"></div>
      <p class="radar-state" id="radarState" role="status"></p>
      <div class="radar-list" id="radarList" aria-live="polite"></div>
    </div>
    <aside class="hub-side" id="tools">
      <a class="side-cta" id="radarBot" target="_blank" rel="noopener"><b id="radarBotTitle"></b><span id="radarBotBody"></span></a>
      <div class="hub-section"><h2 id="toolsTitle"></h2></div>
      <div class="radar-next tools-grid">
        <button type="button" id="radarCalc"><b id="toolCalcTitle"></b><span id="toolCalcBody"></span></button>
        <a href="check/"><b id="toolCheckTitle"></b><span id="toolCheckBody"></span></a>
        <a href="board/"><b id="toolBoardTitle"></b><span id="toolBoardBody"></span></a>
        <a href="start/"><b id="toolStartTitle"></b><span id="toolStartBody"></span></a>
      </div>
      <a class="side-more" id="radarMore" target="_blank" rel="noopener"><b id="radarMoreTitle"></b><span id="radarMoreBody"></span></a>
    </aside>
    <div class="hub-eco" id="ecosystem">
      <div class="hub-section">
        <h2 id="ecoTitle"></h2>
        <p class="small" id="ecoSub"></p>
      </div>
      <div class="eco-grid" id="ecoList"></div>
    </div>
  </section>

  <div id="calcView" role="tabpanel" style="display:contents" hidden>
  <aside class="card risk" id="newbieRisk" aria-labelledby="riskTitle">
    <h2 id="riskTitle"></h2>
    <details class="rig-list" id="riskDetails">
      <summary id="riskDetailTitle"></summary>
      <p id="riskText"></p><p id="riskState"></p>
    </details>
  </aside>

  <p class="since" id="since" hidden></p>

async function startFavorites() {
  if (!snap || walletPending || favoritesController) return;
  const current = snap;
  const addresses = favorites.list().filter(address => favoriteAttempts.get(address) !== current.head);
  if (!addresses.length) return;
  const controller = new AbortController(); favoritesController = controller;
  try {
    await refreshFavorites(addresses, {
      signal: controller.signal,
      readWallet: address => wallet(address, current, () => {}, { signal: controller.signal, apiCandidates: false }),
      onUpdate: item => {
        if (controller.signal.aborted || snap?.head !== current.head || !favorites.list().includes(item.address)) return;
        favoriteAttempts.set(item.address, current.head);
        favoriteResults.set(item.address, item); renderFavorites();
      },
    });
  } catch { /* Aborted overview yields to the selected address. */ }
  finally { if (favoritesController === controller) {
    favoritesController = null;
    // Include addresses added during this scan or a newer head, without retrying
    // a failed address endlessly at the same head.
    if (!controller.signal.aborted) startFavorites();
  } }
}

function paybackContextFor(observation) {
  if (!observation?.head) return null;
  const key = observation.head;
  if (!paybackCache.has(key) && !walletPending) {
    const controller = new AbortController(), entry = { result: null, controller };
    paybackCache.set(key, entry);
    // Separate optional budget: history cannot spend the selected wallet's deadline.
    deadline(signal => readPaybackContext({ ...observation, blockTime: observation.blockTime ?? snap?.blockTime }, { rpc, batch, signal }), 12000, controller.signal)
      .catch(() => null).then(result => {
        if (paybackCache.get(key) !== entry) return;
        entry.result = result; entry.controller = null;
        renderEntry(); if (walletRes && !walletPending) renderMine();
      });
    if (paybackCache.size > 4) {
      const oldest = paybackCache.keys().next().value;
      paybackCache.get(oldest)?.controller?.abort(); paybackCache.delete(oldest);
    }
  }
  return paybackCache.get(key)?.result ?? null;
}

function outputPoolShares(rigs) {
  let verified = 0, unverified = 0, total = 0;
  for (const rig of rigs) {
    if (!(rig.fabPerDay > 0)) continue;
    const shares = rig.poolShares;
    if (!shares || !Number.isFinite(shares.verified) || !Number.isFinite(shares.unverified)
        || Math.abs(shares.verified + shares.unverified - 1) > 1e-6) return null;
    verified += rig.fabPerDay * shares.verified; unverified += rig.fabPerDay * shares.unverified; total += rig.fabPerDay;
  }
  return total > 0 ? { verified: verified / total, unverified: unverified / total } : null;
}

function prepareSlot(request) {
  slotController?.abort();
  const generation = ++slotGeneration;
  slotById = new Map();
  if (chain !== 'fabx' || !walletRes || walletRes.loading) {
    slotState = 'idle';
    return;
  }
  const head = Number.isSafeInteger(walletRes.head) ? walletRes.head : (Number.isSafeInteger(snap?.head) ? snap.head : null);
  if (head == null) { slotState = 'unavailable'; return; }
  slotState = 'loading';
  const controller = new AbortController();
  slotController = controller;
  const ids = (walletRes.rigs || []).map(rig => rig.id);
  loadSlotDefense(ids, head, { rpc, signal: controller.signal }).then(result => {
    if (generation !== slotGeneration || request !== walletRequest || controller.signal.aborted) return;
    slotState = result?.state === 'ready' ? 'ready' : 'unavailable';
    slotById = new Map((result?.rows || []).map(row => [String(row.id), row]));
    if (request === walletRequest && walletRes) renderMine();
  }).catch(error => {
    if (error?.name === 'AbortError' || generation !== slotGeneration || request !== walletRequest) return;
    slotState = 'unavailable';
    slotById = new Map();
    if (request === walletRequest && walletRes) renderMine();
  });
}

async function startCrosschain(request) {
  crossController?.abort();

  crossController = controller;

  bnbUsdt = null;
  renderCrosschain();
  try {
    const [bnb, bem] = await Promise.all([
      readOkxLast('BNB-USDT', globalThis.fetch, controller.signal).catch(() => null),
      loadBemQuote({ signal: controller.signal }).catch(error => {
        if (error?.name === 'AbortError') throw error;
        return { complete: false, reason: 'unread', method: null };
      }),
    ]);
    if (request !== loadRequest || controller.signal.aborted) return;
    bnbUsdt = bnb;
    bemQuote = bem;
  } catch (error) {
    if (error?.name === 'AbortError' || request !== loadRequest) return;
    bemQuote = bemQuote || { complete: false, reason: 'unread', method: null };
  } finally {
    if (crossController === controller) crossController = null;
    if (request === loadRequest && !controller.signal.aborted) renderCrosschain();
  }
}

async function startEntry(request) {
  if (request !== loadRequest || !snap || staleCore) return;
  if (walletPending) { backgroundDeferred = true; return; }
  entryController?.abort();
  const controller = new AbortController(); entryController = controller;
  entryLoading = true; renderEntry();
  try {
    const result = await loadEntryComparison(snap, { signal: controller.signal });
    if (request === loadRequest && !controller.signal.aborted) entryResult = result;
  } catch (error) {
    if (request === loadRequest && !controller.signal.aborted) entryResult = entryResult && ['live', 'cached'].includes(entryResult.state)
      ? { ...entryResult, state: 'cached', error: error.message } : { state: 'unavailable' };
  } finally {
    if (entryController === controller) { entryController = null; entryLoading = false; renderEntry(); }
  }
}

function pendingSummary(w) {

  return L.pendingUnknown(known, total);
}

// One historical read per snapshot head, independent of wallet lookup and language changes.
function growthFor(current) {
  const key = current.head;
  if (!growthCache.has(key)) {
    const entry = { result: null };
    growthCache.set(key, entry);
    deadline(signal => networkGrowth(current, { signal }), Math.max(1, walletExpiresAt - Date.now()))
      .catch(() => ({ measured: false, daily: 0 })).then((result) => {
      entry.result = result;
      if (snap?.head === key && walletRes) renderMine();
    });
  }
  return growthCache.get(key).result;
}

function isPrimarySite() {
  const host = location.hostname;
  return host === 'localhost' || host === '127.0.0.1' || host === 'fabx-miner-desk.pages.dev' || host === 'fabx.leolabs.me';
}
function syncDeepLinkUrl() {
  if (!walletAddr) return;
  if (!isPrimarySite()) {
    const params = new URLSearchParams();
    params.set('addr', walletAddr);
    if (chain !== 'fabx') params.set('chain', chain);
    const hash = pendingRigId ? `rig-${pendingRigId}` : params.toString();
    history.replaceState(null, '', `${location.pathname}${location.search}#${hash}`);
    return;
  }
  const path = /\/rigs\/?$/.test(location.pathname) ? location.pathname.replace(/\/?$/, '/') : '/rigs/';
  const url = new URL(path, location.origin);
  url.searchParams.set('addr', walletAddr);
  if (chain !== 'fabx') url.searchParams.set('chain', chain);
  else url.searchParams.delete('chain');
  url.hash = pendingRigId ? `rig-${pendingRigId}` : '';
  history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
}

function needsOptionalRetry() {
  return ['history', 'nand'].some((key) => ['cached', 'unavailable'].includes(snap?.availability?.[key]?.state));
}

function optionalRetryRefreshCore() {
  if (staleCore) return true;
  const history = snap?.availability?.history?.state;
  return history !== 'live' && history !== 'skipped';
}

function scheduleOptionalRetry(request, options) {
  clearTimeout(retryTimer); retryTimer = null;
  if (request !== loadRequest || walletPending || document.hidden || !needsOptionalRetry()) return;
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (request === loadRequest && !document.hidden) startOptional(request, options, optionalRetryRefreshCore());
  }, OPTIONAL_RETRY_MS);
}

async function startOptional(request, options, refreshCore = false, remainingMs = CFG.loadTimeoutMs) {
  if (request !== loadRequest || !snap || optionalController) return;
  if (walletPending) { backgroundDeferred = true; return; }
  const controller = new AbortController();
  optionalController = controller;
  const expiresAt = Date.now() + remainingMs;
  let coreRefreshed = !refreshCore;
  try {
    if (refreshCore) {
      // A recovered log scan must cover the current 24h window, not the head from before an outage.
      // Keep the previous answer and wallet rows visible while refreshing; user inputs stay untouched.
      const fresh = await snapshot({ ...options, signal: controller.signal });
      if (request !== loadRequest || controller.signal.aborted) return;
      coreRefreshed = true; staleCore = false; snap = fresh; render();
    }
    let skipHistory = false;
    const serverHistory = await fetchServerMarket({ signal: controller.signal });
    if (serverHistory) {
      snap = applyHistory(snap, serverHistory.value, true);
      snap = { ...snap, availability: { ...snap.availability, history: { state: 'live', asOf: serverHistory.asOf, error: null } } };
      skipHistory = true;
      if (request === loadRequest && !controller.signal.aborted) render();
    }
    const updated = await refreshOptional(snap, { ...options, skipHistory, signal: controller.signal,
      timeoutMs: Math.min(CFG.optionalTimeoutMs, Math.max(1, expiresAt - Date.now())), onUpdate(next) {
      if (request !== loadRequest || controller.signal.aborted) return;
      snap = next; render();
    } });
    if (request === loadRequest && !controller.signal.aborted && updated) { snap = updated; render(); }
  } catch (e) {
    // Optional refresh failures must never replace the usable main answer.
    if (request === loadRequest && !controller.signal.aborted) {
      if (!coreRefreshed) {
        staleCore = true;
        if (entryResult && ['live', 'cached'].includes(entryResult.state)) entryResult = { ...entryResult, state: 'cached', error: e.message };
      }
      for (const key of ['history', 'nand']) {
        if (snap.availability?.[key]?.state === 'pending') snap.availability[key] = { state: 'unavailable', asOf: null, error: e.message };
      }
      render();
    }
  } finally {
    if (optionalController === controller) optionalController = null;
    if (request === loadRequest && !controller.signal.aborted) {
      startEntry(request);
      startFavorites();
      scheduleOptionalRetry(request, options);
    }
  }
}

async function load(forceFreshHead = false) {
  const request = ++loadRequest;
  const minHead = forceFreshHead && snap?.head ? snap.head : null;
  coreController?.abort();
  favoritesController?.abort(); favoritesController = null;
  favoriteAttempts.clear();
  for (const entry of paybackCache.values()) entry.controller?.abort();
  paybackCache.clear();
  entryController?.abort(); entryController = null; entryLoading = false; entryResult = null; entryExpanded = false;
  crossController?.abort(); crossController = null; bemQuote = null; bnbUsdt = null;
  const controller = new AbortController();
  coreController = controller;
  const expiresAt = Date.now() + CFG.loadTimeoutMs;
  optionalController?.abort(); optionalController = null;
  clearTimeout(retryTimer); retryTimer = null;
  loadError = null; staleCore = false; snap = null; render();
  startCrosschain(request);
  const value = parseFloat($('nand').value);
  const options = value > 0 ? { nandOkb: value } : {};
  try {
    coreLoad = deadline(signal => snapshot({ ...options, signal, minHead }), CFG.loadTimeoutMs, controller.signal);
    const fresh = await coreLoad;
    if (request !== loadRequest) return;
    showSince(fresh);
    const refreshAddress = walletRes && !walletPending ? walletAddr : null;
    if (refreshAddress) { walletRes = null; show('mineOut', false); show('mineSub', false); show('assetCard', false); show('alertBox', false); }
    snap = fresh; render();
    startFavorites();
    if (refreshAddress) lookup(refreshAddress);
    startOptional(request, options, false, Math.max(1, expiresAt - Date.now()));
  } catch (e) {
    if (request === loadRequest) { loadError = e; render(); }
  }
}

async function currentSnapshot(request) {
  while (!snap && request === walletRequest) {
    if (loadError) throw loadError;
    const pending = coreLoad;
    if (!pending) throw new Error(L.loading);
    await pending.catch(() => {});
    // Let the owning load() publish either its result or its terminal error.
    await Promise.resolve();
  }
  return snap;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(retryTimer); retryTimer = null; }
  else if (!optionalController && snap) {
    const value = snap.availability?.nand?.state === 'manual' ? snap.decision.nandOkb : null;
    scheduleOptionalRetry(loadRequest, value > 0 ? { nandOkb: value } : {});
  }
});

// User-requested reads take precedence over background scans, including during retry backoff.
function pauseBackground() {
  favoritesController?.abort(); favoritesController = null;
  for (const [head, entry] of paybackCache) {
    if (entry.controller) { entry.controller.abort(); paybackCache.delete(head); }
  }
  backgroundDeferred ||= !!(optionalController || entryController || retryTimer);
  optionalController?.abort(); optionalController = null;
  entryController?.abort(); entryController = null; entryLoading = false;
  clearTimeout(retryTimer); retryTimer = null;
}

function resumeBackground() {
  startFavorites();
  if (walletPending || !backgroundDeferred || !snap) return;
  backgroundDeferred = false;
  const value = snap.availability?.nand?.state === 'manual' ? snap.decision.nandOkb : null;
  startOptional(loadRequest, value > 0 ? { nandOkb: value } : {}, staleCore);
}

function walletRetryDelay(error) {
  let retryable = false, wait = 3000;
  for (let e = error, depth = 0; e && depth < 8; e = e.cause, depth++) {
    if (e.name === 'AbortError') return null;
    retryable ||= e.name === 'TimeoutError' || e.retryable === true
      || /timeout|timed out|network|failed to fetch|temporarily unavailable|HTTP (?:403|408|429|5\d\d)|missing trie node|header not found|internal server error/i.test(e.message || '');
    if (Number.isFinite(e.retryAfterMs)) wait = Math.max(wait, e.retryAfterMs);
  }
  return retryable ? wait : null;
}

function waitForWalletRetry(ms, signal) {
  return new Promise((resolve, reject) => {
    signal.throwIfAborted();
    const finish = () => { signal.removeEventListener('abort', abort); resolve(); };
    const timer = setTimeout(finish, ms);
    const abort = () => { clearTimeout(timer); signal.removeEventListener('abort', abort); reject(signal.reason); };
    signal.addEventListener('abort', abort, { once: true });
  });
}

async function lookup(a, timeoutMs = CFG.walletTimeoutMs) {
  $('mineSection').open = true;
  show('werr', false);
  if (!isAddress(a)) { setWalletMessage('badAddr'); show('werr', true); show('pasteRow', true); return; }
  const request = ++walletRequest;
  walletController?.abort();
  const controller = new AbortController();
  walletController = controller;
  walletPending = true; pauseBackground();
  walletMessage = null;
  walletRes = null; walletAddr = null; alertState = null; alertBindUrl = null; renderAlertMsg();
  slotController?.abort(); slotController = null; slotGeneration += 1;
  slotById = new Map(); slotOpen.clear(); slotState = 'idle';
  rigsExpanded = false;
  assetPaybackExpanded = false;
  if ($('assetPayback')) $('assetPayback').open = false;
  if ($('allRigs')) $('allRigs').open = false;
  show('mineIdle', true); show('mineOut', false); show('mineSub', false); show('assetCard', false); show('alertBox', false);
  if (a.toLowerCase() !== exampleWallet().toLowerCase()) store.set('fmd.addr', a);
  $('mine').disabled = true; $('mine').textContent = L.scanning;
  try {
    let result;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        // Core preparation has its own bounded wait. It never spends the wallet budget.
        if (chain !== 'bsc') await deadline(() => currentSnapshot(request), CFG.loadTimeoutMs, controller.signal);
        controller.signal.throwIfAborted();
        const attemptBudget = chain !== 'bsc' ? timeoutMs : BSC_ADDRESS_LOOKUP ? 20_000 : 45_000;
        walletExpiresAt = Date.now() + attemptBudget;
        result = await deadline(async signal => {
          if (chain === 'bsc' && !BSC_ADDRESS_LOOKUP) {
            const measuredSnap = await podSnapshot({ signal, timeoutMs: attemptBudget });
            signal.throwIfAborted();
            if (request !== walletRequest) return;
            podSnap = measuredSnap;
            return await podRigs(a, measuredSnap, (step, progress) => {
              if (signal.aborted || step !== 'measure' || !progress || request !== walletRequest) return;
              walletAddr = a.toLowerCase();
              walletRes = { address: a, circuits: progress.ids.length, discovery: progress.discovery, loading: true,
                pendingFab: null, networkSharePct: null, hours: null, head: measuredSnap.head,
                rigs: progress.ids.map(id => ({ id: String(id), fabPerDay: null, status: 'loading' })) };
              renderMine();
            }, { signal, timeoutMs: attemptBudget });
          }
          if (chain === 'bsc') {
            const indexed = await fetchBscRigs(a, { signal });
            signal.throwIfAborted();
            if (request !== walletRequest) return;
            if (indexed.building || indexed.progress?.complete !== true) return { building: true, progress: indexed.progress, address: a };
            if (!indexed.rigs.length) {
              return { address: a, circuits: 0, rigs: [], discovery: { complete: true, expected: 0, verified: 0, source: 'bsc-index' },
                head: indexed.progress?.head ?? 0, pendingFab: 0, pendingKnown: 0, pendingTotal: 0, pendingComplete: true,
                pendingSubtotalFab: 0, networkSharePct: 0, hours: 0, windowSeconds: null, indexUpdatedAt: indexed.progress?.updatedAt || null };
            }
            const measuredSnap = await podSnapshot({ signal, timeoutMs: attemptBudget });
            signal.throwIfAborted();
            if (request !== walletRequest) return;
            podSnap = measuredSnap;
            return await podRigsForIds(a, indexed.rigs, measuredSnap, (step, progress) => {
              if (signal.aborted || step !== 'measure' || !progress || request !== walletRequest) return;
              walletAddr = a.toLowerCase();
              walletRes = { address: a, circuits: progress.ids.length, discovery: progress.discovery, loading: true,
                pendingFab: null, networkSharePct: null, hours: null, head: measuredSnap.head,
                rigs: progress.ids.map(id => ({ id: String(id), fabPerDay: null, status: 'loading' })) };
              renderMine();
            }, { signal, timeoutMs: attemptBudget, indexUpdatedAt: indexed.progress?.updatedAt });
          }
          let result, measuredSnap;
          // A changed head must be remeasured within this attempt's original budget.
          do {
            measuredSnap = await currentSnapshot(request);
            signal.throwIfAborted();
            if (request !== walletRequest) return;
            result = await wallet(a, measuredSnap, (step, progress) => {
              if (signal.aborted || step !== 'measure' || !progress || request !== walletRequest || measuredSnap.head !== snap?.head) return;
              walletAddr = a.toLowerCase();
              walletRes = { address: a, circuits: progress.ids.length, discovery: progress.discovery, loading: true,
                pendingFab: null, networkSharePct: null, hours: null,
                rigs: progress.ids.map(id => ({ id: String(id), fabPerDay: null, status: 'loading' })) };
              renderMine();
            }, { signal, timeoutMs, apiCandidates: false });
            signal.throwIfAborted();
          } while (request === walletRequest && measuredSnap.head !== snap?.head);
          return result;
        }, attemptBudget, controller.signal);
        break;
      } catch (error) {
        const wait = walletRetryDelay(error);
        if (attempt || wait == null || controller.signal.aborted || request !== walletRequest) throw error;
        await waitForWalletRetry(wait, controller.signal);
        if (!snap && loadError && chain !== 'bsc') load();
      }
    }
    if (request !== walletRequest) return;
    if (result?.blocked || result?.building) {
      walletRes = null;
      walletAddr = a.toLowerCase();
      const when = result.building && result.progress?.updatedAt ? ` · ${observationTime(result.progress.updatedAt)}` : '';
      $('werr').textContent = result.building ? `${L.indexBuilding}${when}` : L.chainBscSoon;
      show('werr', true);
      show('mineIdle', true);
      return;
    }
    walletRes = result; walletAddr = a.toLowerCase();
    prepareSlot(request);
    if (chain === 'fabx' && favorites.list().includes(walletAddr)) {
      favoriteAttempts.set(walletAddr, result.head);
      favoriteResults.set(walletAddr, { status: 'ready', wallet: result, summary: favoriteSummary(result) });
    }
    renderMine();
    if (location.pathname !== '/rigs' && !location.pathname.endsWith('/rigs/')) history.pushState(null, '', '/rigs/');
    syncDeepLinkUrl();
  }
  catch (e) { if (request === walletRequest) {
    if (walletRes?.loading) {
      walletRes = { ...walletRes, loading: false, rigs: walletRes.rigs.map(rig => ({ ...rig, status: 'unread' })) };
      renderMine();
    }
    setWalletMessage('walletFailed', e); show('werr', true); show('mineIdle', true);
    $('addr').value = a; show('pasteRow', true);
  } }
  finally { if (request === walletRequest) {
    walletPending = false;
    $('mine').disabled = false; $('mine').textContent = L.mine;
    resumeBackground();
    if (walletRes && chain === 'fabx') renderMine();
    startFavorites();
  } }
}

// One button: use the wallet extension to read the address if there is one (read-only), else ask for a paste.
$('mine').onclick = async () => {
  const saved = store.get('fmd.addr');
  if (saved && isAddress(saved)) return lookup(saved);
  const eth = window.okxwallet || window.ethereum;
  if (!eth?.request) { setWalletMessage('noWallet'); show('werr', true); show('pasteRow', true); $('addr').focus(); return; }
  const request = ++walletRequest;
  walletController?.abort();
  try {
    $('mine').textContent = L.mineConnecting;
    const [acct] = await deadline(() => eth.request({ method: 'eth_requestAccounts' }), CFG.loadTimeoutMs);
    if (request !== walletRequest) return;
    if (acct) await lookup(acct);
    else { setWalletMessage('noWallet'); show('werr', true); show('pasteRow', true); }
  } catch (e) {
    if (request !== walletRequest) return;
    $('mine').textContent = L.mine;
    setWalletMessage(e?.code === 4001 ? 'rejected' : 'failed', e?.code === 4001 ? null : e); show('werr', true); show('pasteRow', true);
  } finally { if (request === walletRequest) $('mine').textContent = L.mine; }
};
$('go').onclick = () => lookup($('addr').value.trim());

$('favoriteAddr').onkeydown = event => { if (event.key === 'Enter') addFavorite($('favoriteAddr').value.trim()); };

// Homepage tabs (2026-11): the TapeOut ecosystem radar first, the payback calculator second. Rig pages, shared asset
// links and #calc open on the calculator.
let radarState = { status: 'loading', items: [] };
let radarMethod = 'all';
function renderRadar() {
  const R = radarText(lang);
  const E = ecosystemText(lang);
  $('tabRadar').textContent = R.back;
  $('hubNavNow').textContent = R.nav.now;
  $('hubNavEco').textContent = R.nav.eco;
  $('hubNavTools').textContent = R.nav.tools;
  $('radarLive').textContent = R.live;
  $('radarTitle').textContent = R.title;
  $('radarSub').textContent = R.sub;
  $('nowTitle').textContent = R.nowTitle;
  $('nowSub').textContent = R.nowSub;
  $('radarBotTitle').textContent = R.botTitle;
  $('radarBotBody').textContent = R.botBody;
  $('radarBot').href = RADAR_BOT;
  $('radarMoreTitle').textContent = R.moreTitle;
  $('radarMoreBody').textContent = R.moreBody;
  $('radarMore').href = RADAR_MORE;
  $('ecoTitle').textContent = E.title;
  $('ecoSub').textContent = E.sub(ECOSYSTEM_CHECKED);
  $('toolsTitle').textContent = R.toolsTitle;
  for (const [id, key] of [['Calc', 'calc'], ['Check', 'check'], ['Board', 'board'], ['Start', 'start']]) {
    $(`tool${id}Title`).textContent = R.tools[key][0];
    $(`tool${id}Body`).textContent = R.tools[key][1];
  }
  const ok = radarState.status === 'ok';
  const stats = { ...radarStats(ok ? radarState.items : []), projects: PROJECTS.length };
  $('radarStats').innerHTML = ['open', 'projects', 'sources']
    .map((k) => `<div class="radar-stat"><strong>${ok || k === 'projects' ? stats[k] : '–'}</strong><span>${R.stats[k]}</span></div>`).join('');
  const chips = ok ? radarFilters(radarState.items, lang, radarMethod) : '';
  if (!chips) radarMethod = 'all';
  $('radarChips').innerHTML = chips;
  $('radarChips').hidden = !chips;
  const cards = ok ? radarCards(radarState.items, lang, Date.now(), radarMethod) : '';
  $('radarList').innerHTML = cards;
  $('radarState').textContent = radarState.status === 'loading' ? R.loading : radarState.status === 'error' ? R.error : cards ? '' : R.empty;
  $('radarState').hidden = !$('radarState').textContent;
  $('ecoList').innerHTML = ecosystemCards(lang, ok ? radarCounts(radarState.items) : {});
  syncTitle();
}
// The site is the TapeOut hub; the calculator tab and /rigs keep the FabX tool name.
function syncTitle() {
  const R = radarText(lang);
  const calc = $('radarView').hidden;
  document.title = calc ? L.appTitle : R.docTitle;
  $('appTitle').textContent = calc ? L.appTitle : R.siteName;
  if (!calc) $('appTitle').insertAdjacentHTML?.('beforeend', ` <span class="brand-badge">${R.unofficial}</span>`);
}
$('radarChips').onclick = (event) => {
  const chip = event.target.closest?.('[data-method]');
  if (!chip) return;
  radarMethod = chip.dataset.method;
  renderRadar();
};
function setView(view, { remember = true } = {}) {
  const calc = view === 'calc';
  $('radarView').hidden = calc;
  $('calcView').hidden = !calc;
  document.body?.classList?.toggle('hub', !calc);
  syncTitle();
  if (remember) history.replaceState(null, '', `${location.pathname}${location.search}${calc ? '#calc' : ''}`);
}
$('tabRadar').onclick = () => { setView('radar'); window.scrollTo({ top: 0 }); };
$('radarCalc').onclick = () => { setView('calc'); window.scrollTo({ top: 0 }); };
{
  const deep = parseDeepLink(location.href);
  const calcFirst = location.hash === '#calc' || normalizeSitePath(location.pathname) === '/rigs' || Boolean(deep.address || deep.rigId);
  setView(calcFirst ? 'calc' : 'radar', { remember: false });
  renderRadar();
  fetchRadar(apiUrl('/api/radar')).then((next) => { radarState = next; renderRadar(); });
}
$('ruleOn').onchange = () => { rule.on = $('ruleOn').checked; saveRule(); render(); };
$('ruleAdd').onclick = () => { rule.rows.push({ minRatio: 1, sell: 0 }); saveRule(); render(); };
const bootHref = location.href && !location.href.endsWith('undefined')
  ? location.href
  : `${location.origin || 'http://localhost'}${location.pathname || '/'}${location.search || ''}${location.hash || ''}`;
const bootLink = parseDeepLink(bootHref);
const explicitChain = /(?:^|[#?&])chain=(bsc|fabx)(?:&|$)/.exec(bootHref)?.[1];
if (explicitChain === 'bsc' || explicitChain === 'fabx') {
  chain = explicitChain;
  store.set('fmd.chain', chain);
} else if (bootLink.address && isAddress(bootLink.address)) {
  chain = 'fabx';
  store.set('fmd.chain', 'fabx');
}
pendingRigId = bootLink.rigId;
applyStatic();
load();
if (bootLink.address && isAddress(bootLink.address) && isDeskEntryPath(location.pathname)) {
  lookup(bootLink.address);
}
